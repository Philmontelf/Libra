<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
.fishL {
  position: absolute;
  width: 100px;
  height: 60px;
  background-color: #2c2c2c; /* colore grigio bottone */
  color: #2c2c2c; /* currentColor per coda */
  border-radius: 50% 50% 50% 50% / 100% 100% 100% 100%;
  transition: left .8s cubic-bezier(.25,1.2,.3,1), background-color .4s, color .4s;
  transform: scaleX(-1);
}
.fishL::after {
  content:'';
  position:absolute;
  right:-25px;
  top:10px;
  border-top:20px solid transparent;
  border-bottom:20px solid transparent;
  border-left:30px solid currentColor; /* coda segue colore */
  transform: scaleX(-1);
}
.fishL::before {
  content:'';
  position:absolute;
  left:20px;
  top:15px;
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
}

.fishR {
  position: absolute;
  width: 100px;
  height: 60px;
  background-color: #2c2c2c;
  color: #2c2c2c; /* currentColor per coda */
  border-radius: 50% 50% 50% 50% / 100% 100% 100% 100%;
  transition: left .8s cubic-bezier(.25,1.2,.3,1), background-color .4s, color .4s;
  transform: scaleX(-1);
}
.fishR::after {
  content:'';
  position:absolute;
  left:-25px;
  top:10px;
  border-left:none;
  border-right:30px solid currentColor; /* coda segue colore */
  border-top:20px solid transparent;
  border-bottom:20px solid transparent;
  transform: scaleX(-1);
}
.fishR::before {
  content:'';
  position:absolute;
  left:auto;
  right:20px;
  top:15px;
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
}
</style>
</head>
<body>

<div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; text-align:center; margin:40px 0; display:flex; flex-direction:column; align-items:center;">

  <div style="display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:15px;">
    <input id="numL" type="number" style="width:200px; padding:10px; text-align:center; border-radius:10px; border:3px solid #ccc; font-size:16px; font-weight:700; color:#333; transition:all .25s;">
    <input id="numR" type="number" style="width:200px; padding:10px; text-align:center; border-radius:10px; border:3px solid #ccc; font-size:16px; font-weight:700; color:#333; transition:all .25s;">
    <button id="checkBtn" style="width:52px; height:52px; border-radius:50%; border:none; background:#2c2c2c; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div style="width:400px; height:200px; position:relative;">
    <div id="fishL" class="fishL" style="left:50px; top:70px;"></div>
    <div id="fishR" class="fishR" style="left:250px; top:70px;"></div>
  </div>

</div>

<script>
const btn = document.getElementById('checkBtn');
const numL = document.getElementById('numL');
const numR = document.getElementById('numR');
const fishL = document.getElementById('fishL');
const fishR = document.getElementById('fishR');

const center = 200; // centro convenzionale
const fishWidth = 100;

function moveFish(diffDistance){
  fishL.style.left = (center - diffDistance - fishWidth) + "px";
  fishR.style.left = (center + diffDistance) + "px";
}

btn.onclick = ()=>{
  const nL = parseFloat(numL.value) || 0;
  const nR = parseFloat(numR.value) || 0;
  const diff = Math.abs(nL - nR);

  let fishColor = '#2c2c2c'; // default grigio
  if(nL === nR){
    numL.style.borderColor = numR.style.borderColor = '#4CAF50';
    numL.style.color = numR.style.color = '#4CAF50';
    fishColor = '#4CAF50'; // verdi
  } else {
    numL.style.borderColor = numR.style.borderColor = '#f44336';
    numL.style.color = numR.style.color = '#f44336';
    fishColor = '#f44336'; // rossi
  }

  fishL.style.backgroundColor = fishR.style.backgroundColor = fishColor;
  fishL.style.color = fishR.style.color = fishColor; // per la coda

  // distanza dal centro
  let d = 0;
  if(diff === 0) d = 0;
  else if(diff > 15) d = 60;
  else if(diff > 8) d = 40;
  else d = 20;

  moveFish(d);
};
</script>

</body>
</html>
