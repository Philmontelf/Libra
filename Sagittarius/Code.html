<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --colore-freccia-base: #2c2c2c;
      --colore-pallina-base: #2d3436;
      --verde-successo: #4CAF50;
      --freccia-width: 126px;
      --freccia-height: 42px;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      background: #f0f2f5; margin: 0; padding-top: 40px;
    }

    .ui-container { text-align: center; margin-bottom: 30px; }
    .math-hint { margin-bottom: 15px; color: #777; font-weight: bold; font-size: 22px; }
    .input-box { display: flex; justify-content: center; align-items: center; gap: 12px; }

    #wordInput {
      width: 120px; padding: 12px; text-align: center; border-radius: 12px;
      border: 3px solid #ccc; font-size: 24px; font-weight: 700; outline: none;
    }

    #checkBtn {
      width: 55px; height: 55px; border-radius: 50%; border: none;
      background: #2c2c2c; color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .campo-tiro {
      width: 800px; height: 400px; position: relative; 
      border-radius: 25px; 
      overflow: hidden; display: flex; align-items: center;
    }

    .contenitore-freccia {
      width: var(--freccia-width); height: var(--freccia-height);
      position: absolute; left: 50px; top: 179px; 
      z-index: 20;
      transform-origin: center right;
      transform: translate(0, 0) rotate(0deg);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .in-volo { transition: none; }

    .pallina {
      position: absolute; right: 97px; top: 160px;
      width: 80px; height: 80px; 
      background: var(--colore-pallina-base);
      border-radius: 50%;
      z-index: 10;
      transition: background 0.3s ease;
    }

    @keyframes tiro-centro {
      0%   { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(459px, 0) rotate(0deg); } 
    }
    @keyframes flop-corto {
      0%   { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(180px, 150px) rotate(60deg); }
    }
    @keyframes flop-medio {
      0%   { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(350px, 120px) rotate(45deg); }
    }

    .anim-centro { animation: tiro-centro 0.4s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .anim-corto  { animation: flop-corto 0.8s forwards ease-in; }
    .anim-medio  { animation: flop-medio 0.9s forwards ease-in; }

    svg { width: 100%; height: 100%; overflow: visible; }
    #path-freccia { fill: var(--colore-freccia-base); transition: fill 0.3s ease; }
  </style>
</head>
<body>

  <div class="ui-container">
    <div class="math-hint">Risolvi: <span id="operazione"></span></div>
    <div class="input-box">
      <input id="wordInput" type="number" placeholder="?">
      <button id="checkBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="campo-tiro">
    <div class="contenitore-freccia" id="freccia">
      <svg viewBox="0 0 100 40"><path id="path-freccia" d="" /></svg>
    </div>
    <div class="pallina" id="bersaglio"></div>
  </div>

<script>
  const input = document.getElementById('wordInput');
  const btn = document.getElementById('checkBtn');
  const opSpan = document.getElementById('operazione');
  const freccia = document.getElementById('freccia');
  const bersaglio = document.getElementById('bersaglio');

  let risultatoEsatto = 0;
  let resetTimeout;

  function generaOperazione() {
    const a = Math.floor(Math.random() * 10) + 1;
    const b = Math.floor(Math.random() * 10) + 1;
    risultatoEsatto = a + b;
    opSpan.innerText = `${a} + ${b}`;
    input.value = ""; 
    input.style.borderColor = "#ccc"; 
    input.focus();
    
    // Reset colori totale
    document.documentElement.style.setProperty('--colore-freccia-base', '#2c2c2c');
    bersaglio.style.background = "#2d3436";
  }

  function attivaLancio(classe, colore, colpisciBersaglio) {
    clearTimeout(resetTimeout);
    
    // Colora la freccia
    document.documentElement.style.setProperty('--colore-freccia-base', colore);
    
    // Colora il bersaglio SOLO se è corretto
    if (colpisciBersaglio) {
      bersaglio.style.background = colore;
    } else {
      bersaglio.style.background = "#2d3436"; // Resta scuro
    }
    
    freccia.classList.remove('anim-corto', 'anim-medio', 'anim-centro', 'in-volo');
    void freccia.offsetWidth; 
    freccia.classList.add('in-volo', classe);

    resetTimeout = setTimeout(tornaIndietro, 1500);
  }

  function tornaIndietro() {
    const style = window.getComputedStyle(freccia);
    const matrix = style.transform;
    freccia.classList.remove('anim-corto', 'anim-medio', 'anim-centro', 'in-volo');
    freccia.style.transform = matrix;
    void freccia.offsetWidth;
    freccia.style.transform = "translate(0, 0) rotate(0deg)";
    
    setTimeout(() => {
      // Se era verde (indovinato), genera nuova operazione
      if (input.style.borderColor === 'rgb(76, 175, 80)') {
          generaOperazione();
      } else {
          // Se ha sbagliato, torna allo stato neutro per riprovare
          document.documentElement.style.setProperty('--colore-freccia-base', '#2c2c2c');
          input.value = ""; 
          input.style.borderColor = "#ccc";
          freccia.style.transform = "";
      }
    }, 800);
  }

  btn.onclick = () => {
    const valore = parseInt(input.value);
    if (isNaN(valore)) return;
    
    if (valore === risultatoEsatto) {
      input.style.borderColor = '#4CAF50';
      attivaLancio('anim-centro', '#4CAF50', true); // TRUE: Colora bersaglio
    } else if (Math.abs(valore - risultatoEsatto) <= 2) {
      input.style.borderColor = '#FF9800';
      attivaLancio('anim-medio', '#FF9800', false); // FALSE: Bersaglio resta base
    } else {
      input.style.borderColor = '#f44336';
      attivaLancio('anim-corto', '#f44336', false); // FALSE: Bersaglio resta base
    }
  };

  function generaPath(punti) {
    let d = "";
    for (let i = 0; i < punti.length; i++) {
      const curr = punti[i], prev = punti[i === 0 ? punti.length - 1 : i - 1], next = punti[(i + 1) % punti.length];
      const r = parseFloat(curr.r) || 0;
      const l1 = Math.hypot(curr.x-prev.x, curr.y-prev.y), l2 = Math.hypot(next.x-curr.x, next.y-curr.y);
      const rf = Math.min(r, l1/2, l2/2);
      const x1 = curr.x-(curr.x-prev.x)*(rf/l1), y1 = curr.y-(curr.y-prev.y)*(rf/l1);
      const x2 = curr.x+(next.x-curr.x)*(rf/l2), y2 = curr.y+(next.y-curr.y)*(rf/l2);
      d += (i===0 ? `M${x1},${y1}` : ` L${x1},${y1}`) + (rf > 0 ? ` Q${curr.x},${curr.y} ${x2},${y2}` : ` L${curr.x},${curr.y}`);
    }
    return d + " Z";
  }

  function disegna() {
    const puntiFreccia = [
      {x: 0,  y: 10, r: 1}, {x: 15, y: 10, r: 10}, {x: 15, y: 18, r: 0},
      {x: 80, y: 18, r: 0}, {x: 80, y: 10, r: 0}, {x: 100,y: 20, r: 0},
      {x: 80, y: 30, r: 0}, {x: 80, y: 22, r: 0}, {x: 15, y: 22, r: 0},
      {x: 15, y: 30, r: 10}, {x: 0,  y: 30, r: 1}, {x: 8,  y: 20, r: 0}
    ];
    document.getElementById('path-freccia').setAttribute('d', generaPath(puntiFreccia));
  }

  generaOperazione(); disegna();
  input.addEventListener("keypress", (e) => { if (e.key === "Enter") btn.click(); });
</script>

</body>
</html>
