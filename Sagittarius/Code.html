<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      /* --- PARAMETRI FRECCIA --- */
      --colore-freccia: #ff4757;
      --larghezza-freccia: 150px;
      --altezza-freccia: 60px;
      
      /* Smussatura angoli freccia (pixel) */
      --r-coda-su: 2px;
      --r-collo-su: 2px;
      --r-spalla-in-su: 1px;
      --r-spalla-ex-su: 0px;
      --r-punta-principale: 12px; 
      --r-spalla-ex-giu: 0px;
      --r-spalla-in-giu: 1px;
      --r-collo-giu: 2px;
      --r-coda-giu: 2px;
      --r-rientro-v: 6px;

      /* --- PARAMETRI MELA (BERSAGLIO) --- */
      --colore-mela: #eb4d4b;
      --mela-dimensione: 80px;      /* Scala generale della mela */
      --mela-tondezza-su: 25px;    /* Curvatura parte superiore */
      --mela-opacita-ovali: 0.2;   /* Visibilità dei due ovali interni */

      /* --- POSIZIONI --- */
      --pos-a: 50px;
      --pos-b: 530px; 
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
      background: #f4f4f4;
      font-family: sans-serif;
    }

    .campo-tiro {
      width: 800px;
      height: 250px;
      position: relative;
      background: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* --- MELA --- */
    .mela {
      position: absolute;
      right: 120px;
      width: var(--mela-dimensione);
      height: var(--mela-dimensione);
    }

    .mela-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- FRECCIA --- */
    .contenitore-freccia {
      width: var(--larghezza-freccia);
      height: var(--altezza-freccia);
      position: absolute;
      left: 0;
      transition: transform 0.6s ease-in-out;
      transform: translateX(var(--pos-a));
      z-index: 10;
    }

    .contenitore-freccia.attiva {
      transform: translateX(var(--pos-b));
    }

    #path-freccia { fill: var(--colore-freccia); }

    button {
      margin-top: 30px;
      padding: 15px 35px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      background: #2f3542;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="campo-tiro">
    <div class="contenitore-freccia" id="freccia">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%; height:100%;">
        <path id="path-freccia" d="" />
      </svg>
    </div>

    <div class="mela">
      <svg class="mela-svg" viewBox="0 0 100 100">
        <path fill="var(--colore-mela)" d="
          M 50,30 
          C 20,10 0,30 0,60 
          C 0,90 40,100 50,95 
          C 60,100 100,90 100,60 
          C 100,30 80,10 50,30 Z" 
        />
        <ellipse cx="33" cy="60" rx="20" ry="25" fill="rgba(255,255,255,var(--mela-opacita-ovali))" />
        <ellipse cx="67" cy="60" rx="20" ry="25" fill="rgba(255,255,255,var(--mela-opacita-ovali))" />
      </svg>
    </div>
  </div>

  <button onclick="document.getElementById('freccia').classList.toggle('attiva')">LANCIA / RESET</button>

  <script>
    function disegnaFreccia() {
      const s = getComputedStyle(document.documentElement);
      const punti = [
        { x: 0,   y: 8,  r: s.getPropertyValue('--r-coda-su') },
        { x: 15,  y: 8,  r: s.getPropertyValue('--r-collo-su') },
        { x: 25,  y: 18, r: s.getPropertyValue('--r-spalla-in-su') },
        { x: 80,  y: 18, r: s.getPropertyValue('--r-spalla-ex-su') },
        { x: 80,  y: 5,  r: s.getPropertyValue('--r-spalla-ex-su') },
        { x: 100, y: 20, r: s.getPropertyValue('--r-punta-principale') },
        { x: 80,  y: 35, r: s.getPropertyValue('--r-spalla-ex-giu') },
        { x: 80,  y: 22, r: s.getPropertyValue('--r-spalla-in-giu') },
        { x: 25,  y: 22, r: s.getPropertyValue('--r-collo-giu') },
        { x: 15,  y: 32, r: s.getPropertyValue('--r-coda-giu') },
        { x: 0,   y: 32, r: s.getPropertyValue('--r-coda-giu') },
        { x: 10,  y: 20, r: s.getPropertyValue('--r-rientro-v') }
      ];

      let d = "";
      for (let i = 0; i < punti.length; i++) {
        const curr = punti[i], prev = punti[i === 0 ? punti.length - 1 : i - 1], next = punti[(i + 1) % punti.length];
        const r = Math.min(parseFloat(curr.r) || 0, Math.hypot(curr.x-prev.x, curr.y-prev.y)/2, Math.hypot(next.x-curr.x, next.y-curr.y)/2);
        const x1 = curr.x - (curr.x - prev.x) * (r / Math.hypot(curr.x-prev.x, curr.y-prev.y));
        const y1 = curr.y - (curr.y - prev.y) * (r / Math.hypot(curr.x-prev.x, curr.y-prev.y));
        const x2 = curr.x + (next.x - curr.x) * (r / Math.hypot(next.x-curr.x, next.y-curr.y));
        const y2 = curr.y + (next.y - curr.y) * (r / Math.hypot(next.x-curr.x, next.y-curr.y));
        d += (i === 0 ? `M${x1},${y1}` : `L${x1},${y1}`) + (r > 0 ? `Q${curr.x},${curr.y} ${x2},${y2}` : `L${curr.x},${curr.y}`);
      }
      document.getElementById('path-freccia').setAttribute('d', d + "Z");
    }
    disegnaFreccia();
  </script>
</body>
</html>
