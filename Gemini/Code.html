<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gemini - Mirror Logic (Pistol-Stable)</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* --- UI HEADER --- */
        .ui-header {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .zodiac-title {
            margin-bottom: 15px;
            color: #777;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: -0.5px; /* Compatto come richiesto */
            font-size: 14px;
        }

        /* --- STRUTTURA TASTO E INPUT (Recuperata dal tuo codice) --- */
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            position: relative;
        }

        .gemini-input {
            width: 140px;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            border: 3px solid #ccc;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            transition: all .25s;
            text-transform: uppercase;
            outline: none;
        }

        #checkBtn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: #2c2c2c;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #verifyLabel {
            position: absolute;
            right: -90px; /* Esattamente come nel codice Pisces */
            top: 50%;
            transform: translateY(-50%) translateX(-8px);
            opacity: 0;
            color: #2c2c2c;
            font-weight: 700;
            font-size: 16px;
            pointer-events: none;
            transition: opacity .3s, transform .3s;
            white-space: nowrap;
        }

        /* --- FACCE (Codice Originale Intoccato) --- */
        .container { display: flex; gap: 15px; }
        .half {
            width: 110px;
            height: 480px;
            background-color: #2c2c2c;
            position: relative;
            transition: all 1s cubic-bezier(0.65, 0, 0.35, 1), background-color 0.4s;
        }
        .eye, .lip {
            position: absolute;
            background-color: #fff;
            transition: all 1s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .left { border-radius: 100px 0 0 100% / 100px 0 0 350px; }
        .right { border-radius: 0 100px 100% 0 / 0 100px 350px 0; }
        .eye { width: 24px; height: 24px; border-radius: 50%; top: 80px; }
        .left .eye { right: 40px; }
        .right .eye { left: 40px; }
        .lip { width: 40px; height: 12px; top: 348px; }
        .left .lip { right: 0; border-radius: 20px 0 0 20px; }
        .right .lip { left: 0; border-radius: 0 20px 20px 0; }

        .mode-inverted .right { border-radius: 0 100% 100px 0 / 0 350px 100px 0; }
        .mode-inverted .right .eye { top: 376px; }
        .mode-inverted .right .lip { top: 80px; }

        .mode-tapered .left { border-radius: 120px 0 0 100% / 100px 0 0 420px; }
        .mode-tapered .right { border-radius: 0 80px 100% 0 / 0 180px 280px 0; }
        .mode-tapered .left .eye { width: 48px; height: 48px; right: 35px; }
        .mode-tapered .right .eye { width: 14px; height: 14px; left: 55px; }
        .mode-tapered .left .lip { width: 15px; height: 15px; border-radius: 50% 0 0 50%; right: 0; }
        .mode-tapered .right .lip { width: 75px; height: 35px; border-radius: 0 40% 40% 0; left: 0; }
    </style>
</head>
<body class="mode-equal">

    <div class="ui-header">
        <div class="zodiac-title">Gemini Mirror Challenge</div>
        
        <div class="input-group">
            <input id="inputLeft" class="gemini-input" type="text" placeholder="Word A">
            <input id="inputRight" class="gemini-input" type="text" placeholder="Word B">
            
            <div style="position:relative;">
                <button id="checkBtn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <span id="verifyLabel">Verify</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="half left">
            <div class="eye"></div>
            <div class="lip"></div>
        </div>
        <div class="half right">
            <div class="eye"></div>
            <div class="lip"></div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('checkBtn');
        const label = document.getElementById('verifyLabel');
        const inL = document.getElementById('inputLeft');
        const inR = document.getElementById('inputRight');
        const halves = document.querySelectorAll('.half');

        // Gestione Hover (Identica al tuo codice Pisces)
        btn.onmouseenter = () => {
            label.style.opacity = 1;
            label.style.transform = 'translateY(-50%) translateX(0)';
        };
        btn.onmouseleave = () => {
            label.style.opacity = 0;
            label.style.transform = 'translateY(-50%) translateX(-8px)';
        };

        // Logica di verifica
        btn.onclick = () => {
            const valL = inL.value.trim().toUpperCase();
            const valR = inR.value.trim().toUpperCase();
            let color = '#2c2c2c'; let mode = 'mode-equal';

            if (valL === "" || valR === "") { 
                color = '#2c2c2c'; mode = 'mode-equal'; 
            }
            else if (valL === valR) { 
                color = '#4CAF50'; mode = 'mode-equal'; // Identiche: VERDE
            } 
            else if (valL === valR.split('').reverse().join('')) { 
                color = '#f44336'; mode = 'mode-inverted'; // Speculari: ROSSO
            }
            else if (valL.length === valR.length) { 
                color = '#FF9800'; mode = 'mode-tapered'; // Stessa lunghezza: ARANCIO
            }
            else { 
                color = '#2c2c2c'; mode = 'mode-inverted'; // Diverse: GRIGIO
            }

            document.body.className = mode;
            inL.style.borderColor = inL.style.color = color;
            inR.style.borderColor = inR.style.color = color;
            halves.forEach(h => h.style.backgroundColor = color);
        };
    </script>
</body>
</html>
