<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gemini Mirror Challenge - Final Polish</title>
    <style>
        body {
            background-color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            transition: background-color 0.4s;
        }

        .ui-header {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .zodiac-title {
            margin-bottom: 15px;
            color: #777;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: -0.8px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            position: relative;
        }

        .gemini-input {
            width: 140px;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            border: 3px solid #ccc;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            transition: all .25s;
            text-transform: uppercase;
            outline: none;
        }

        .btn-wrapper {
            position: relative;
        }

        #checkBtn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: #2c2c2c;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        #checkBtn:active { transform: scale(0.95); }

        #verifyLabel {
            position: absolute;
            right: -85px;
            top: 50%;
            transform: translateY(-50%) translateX(-8px);
            opacity: 0;
            /* Label SEMPRE Nera 2c2c2c */
            color: #2c2c2c !important; 
            font-weight: 700;
            font-size: 16px;
            pointer-events: none;
            transition: opacity .3s, transform .3s;
            white-space: nowrap;
        }

        /* --- FACCE --- */
        .container { display: flex; gap: 15px; }

        .half {
            width: 110px;
            height: 480px;
            background-color: #2c2c2c;
            position: relative;
            transition: all 1s cubic-bezier(0.65, 0, 0.35, 1), background-color 0.4s;
        }

        .eye, .lip {
            position: absolute;
            background-color: #fff;
            transition: all 1s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .left-half { border-radius: 100px 0 0 100% / 100px 0 0 350px; }
        .right-half { border-radius: 0 100px 100% 0 / 0 100px 350px 0; }
        .eye { width: 24px; height: 24px; border-radius: 50%; top: 80px; }
        .left-half .eye { right: 40px; }
        .right-half .eye { left: 40px; }
        .lip { width: 40px; height: 12px; top: 348px; }
        .left-half .lip { right: 0; border-radius: 20px 0 0 20px; }
        .right-half .lip { left: 0; border-radius: 0 20px 20px 0; }

        .mode-inverted .right-half { border-radius: 0 100% 100px 0 / 0 350px 100px 0; }
        .mode-inverted .right-half .eye { top: 376px; }
        .mode-inverted .right-half .lip { top: 80px; }

        .mode-tapered .left-half { border-radius: 120px 0 0 100% / 100px 0 0 420px; }
        .mode-tapered .right-half { border-radius: 0 80px 100% 0 / 0 180px 280px 0; }
        .mode-tapered .left-half .eye { width: 48px; height: 48px; right: 35px; }
        .mode-tapered .right-half .eye { width: 14px; height: 14px; left: 55px; }
        .mode-tapered .left-half .lip { width: 15px; height: 15px; border-radius: 50% 0 0 50%; right: 0; }
        .mode-tapered .right-half .lip { width: 75px; height: 35px; border-radius: 0 40% 40% 0; left: 0; }

    </style>
</head>
<body>

    <div class="ui-header">
        <div class="zodiac-title">Gemini Mirror Challenge</div>
        
        <div class="input-group">
            <input id="inputL" class="gemini-input" type="text" placeholder="WORD A">
            <input id="inputR" class="gemini-input" type="text" placeholder="WORD B">
            
            <div class="btn-wrapper">
                <button id="checkBtn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <span id="verifyLabel">Verify</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="faceL" class="half left-half">
            <div class="eye"></div>
            <div class="lip"></div>
        </div>
        <div id="faceR" class="half right-half">
            <div class="eye"></div>
            <div class="lip"></div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('checkBtn');
        const label = document.getElementById('verifyLabel');
        const inL = document.getElementById('inputL');
        const inR = document.getElementById('inputR');
        const faceL = document.getElementById('faceL');
        const faceR = document.getElementById('faceR');

        btn.onmouseenter = () => {
            label.style.opacity = 1;
            label.style.transform = 'translateY(-50%) translateX(0)';
        };
        btn.onmouseleave = () => {
            label.style.opacity = 0;
            label.style.transform = 'translateY(-50%) translateX(-8px)';
        };

        btn.onclick = () => {
            const valL = inL.value.trim().toUpperCase();
            const valR = inR.value.trim().toUpperCase();
            
            const mainBlack = '#2c2c2c';
            let color = mainBlack; 
            let mode = 'mode-equal';

            // RESET se uno dei due è vuoto
            if (valL === "" || valR === "") {
                color = mainBlack;
                mode = 'mode-equal';
            }
            // REGOLA LUNGHEZZA DIVERSA (Qualsiasi box sia più lungo)
            else if (valL.length !== valR.length) {
                color = mainBlack; 
                mode = 'mode-inverted';
            }
            // Identiche: VERDE
            else if (valL === valR) {
                color = '#4CAF50';
                mode = 'mode-equal';
            } 
            // Speculari: ROSSO
            else if (valL === valR.split('').reverse().join('')) {
                color = '#f44336';
                mode = 'mode-inverted';
            }
            // Stessa lunghezza ma diverse: ARANCIO
            else {
                color = '#FF9800';
                mode = 'mode-tapered';
            }

            // Applicazione
            document.body.className = mode;
            inL.style.borderColor = inL.style.color = color;
            inR.style.borderColor = inR.style.color = color;
            faceL.style.backgroundColor = faceR.style.backgroundColor = color;
            // Label forzata a 2c2c2c (anche se la logica JS provasse a cambiarla)
            label.style.color = '#2c2c2c';
        };
    </script>
</body>
</html>
